- id: fish-meat-bitul
  title: Fish and meat — danger, bitul, and practical cases
  prompt: Explain the highlighted approaches to the danger of mixing fish and meat, whether bitul b’shishim applies,
    whether one may add more food to create bitul, and the two practical gefilte-fish cases.
  modelAnswer: Magen Avraham writes that it is possible the danger no longer applies today because circumstances
    may have changed; Divrei Malkiel understands that this can extend even to eating fish and meat together, though
    the course uses it only as a tziruf. Issur V’Heter applies bitul b’shishim, while Maharil says סכנתא חמירא מאיסורא
    and does not allow shishim. S”A allows adding more permitted food to nullify an accidentally mixed rabbinic
    prohibition. Pischei Teshuva says even the Rama would agree in the fish-and-meat danger case because אין מבטלין
    איסור לכתחילה applies to prohibition rather than danger once the flavor is gone. Rav Wosner distinguishes frozen
    gefilte fish removed immediately from fish that has begun defrosting. Chayei Halevi says meat juice that enters
    crevices of gefilte fish can forbid the fish even with shishim.
  notes:
    compact: 6
    full: 16
  tags:
  - Fish & Meat
  pairings:
    roots:
    - id: fmb-magen-avraham
      label: Magen Avraham
      context: Status of the danger today
      accepts:
      - fmb-r1
      reviewClips:
      - review: 3
        start: 27
        label: Magen Avraham as a leniency factor
    - id: fmb-divrei-malkiel
      label: Divrei Malkiel
      context: How far the Magen Avraham’s idea extends
      accepts:
      - fmb-r2
      reviewClips:
      - review: 3
        start: 27
        label: Magen Avraham as a leniency factor
    - id: fmb-issur-veheter
      label: Issur V’Heter
      context: Fish mixed into meat
      accepts:
      - fmb-r3
      reviewClips:
      - review: 3
        start: 74
        label: Bitul in a fish-and-meat סכנה mixture
    - id: fmb-maharil
      label: Maharil
      context: Fish mixed into meat
      accepts:
      - fmb-r4
      reviewClips:
      - review: 3
        start: 74
        label: Bitul in a fish-and-meat סכנה mixture
    - id: fmb-shulchan-aruch
      label: S”A
      context: Adding permitted food after an accidental rabbinic mixture
      accepts:
      - fmb-r5
      reviewClips:
      - review: 3
        start: 74
        label: Bitul and additional leniency routes
    - id: fmb-pischei-teshuva
      label: Pischei Teshuva on the Rama
      context: Creating bitul in the fish-and-meat danger case
      accepts:
      - fmb-r6
      reviewClips:
      - review: 3
        start: 74
        label: Bitul and additional leniency routes
    - id: fmb-rav-wosner
      label: Rav Wosner
      context: Gefilte fish dropped into chicken soup
      accepts:
      - fmb-r7
      reviewClips:
      - review: 3
        start: 74
        label: Gefilte fish practical case
    - id: fmb-chayei-halevi
      label: Chayei Halevi
      context: Meat juice that falls on gefilte fish
      accepts:
      - fmb-r8
      reviewClips:
      - review: 3
        start: 74
        label: Gefilte fish practical case
    responses:
    - id: fmb-r1
      text: It is possible that the danger of eating fish and meat no longer exists today because circumstances
        may have changed with time and place.
    - id: fmb-r2
      text: Understands the Magen Avraham as allowing even fish and meat together; although that is not followed
        outright, it may be used as a tziruf.
    - id: fmb-r3
      text: Fish that falls into meat is batel b’shishim like another prohibition.
    - id: fmb-r4
      text: 'סכנתא חמירא מאיסורא: danger is treated more strictly, so fish in meat is not batel merely because there
        is shishim.'
    - id: fmb-r5
      text: For an accidentally mixed rabbinic prohibition, more permitted food may be added to nullify it.
    - id: fmb-r6
      text: Even the Rama can allow adding enough food to remove the fish flavor, because אין מבטלין איסור לכתחילה
        is a rule of prohibition, not danger once the dangerous taste is gone.
    - id: fmb-r7
      text: If frozen gefilte fish was removed immediately, everything is permitted; if it began to defrost, shishim
        is needed against the entire fish.
    - id: fmb-r8
      text: If meat juice penetrates gefilte fish, the fish can remain forbidden even with shishim because the liquid
        can remain in its crevices.
    - id: fmb-d1
      text: Fish and meat are never subject to any form of bitul because every danger is treated exactly like snake
        venom.
      distractor: true
    - id: fmb-d2
      text: A frozen piece of gefilte fish is always forbidden once it touches chicken soup, even if removed immediately.
      distractor: true
- id: dish-transfer
  title: Hot-water transfer — direct streams and opposite-type dishes
  prompt: Match the highlighted rulings and explanations concerning a continuous stream of hot parve liquid from
    a ben-yomo fleishig pot into a dairy bowl.
  modelAnswer: The Rama forbids the bottom dairy bowl when a continuous stream from the ben-yomo fleishig pot reaches
    it, while the soup itself is permitted because the cold bottom bowl invokes תתאה גבר. Taz explains that the
    uninterrupted stream remains connected to the source and has not yet become נ״ט בר נ״ט. Shach and Pri Megadim
    add that the absorbed dairy flavor does not travel back up the stream into the upper pot. Shach distinguishes
    solids, which disconnect from the pot and become נ״ט בר נ״ט, from a directly poured liquid under the Rama. Shach
    ultimately argues with the Rama and permits the bowl because the stream is already disconnected; Chochmas Adam
    is lenient but says that without financial loss one should follow the Rama as a chumra.
  notes:
    compact: 9
    full: 23
  tags:
  - Dishes, Sinks & Dishwashers
  - נ״ט בר נ״ט
  pairings:
    roots:
    - id: dt-rama
      label: Rama
      context: Continuous stream from a ben-yomo fleishig pot into a cold dairy bowl
      accepts:
      - dt-a
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    - id: dt-taz
      label: Taz
      context: Why the uninterrupted stream matters
      accepts:
      - dt-b
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    - id: dt-shach-pmg
      label: Shach / Pri Megadim
      context: What becomes forbidden through the stream
      accepts:
      - dt-c
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    - id: dt-shach-distinction
      label: Shach
      context: Liquids compared with solids
      accepts:
      - dt-d
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    - id: dt-shach-psak
      label: Shach
      context: Bottom bowl lema’ase
      accepts:
      - dt-e
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    - id: dt-chochmas-adam
      label: Chochmas Adam
      context: Practical ruling when there is no financial loss
      accepts:
      - dt-f
      reviewClips:
      - review: 4
        start: 128
        label: Continuous stream into the opposite vessel
    responses:
    - id: dt-a
      text: The bottom dairy bowl is forbidden if the continuous stream comes directly from the ben-yomo fleishig
        pot; the soup is permitted because the cold bowl invokes תתאה גבר.
    - id: dt-b
      text: The uninterrupted stream is still connected to the fleishig pot, so the liquid has not yet become נ״ט
        בר נ״ט.
    - id: dt-c
      text: Only the bottom plate is forbidden; the upper pot is not, because dairy flavor cannot travel back up
        the stream, and the liquid remains permitted.
    - id: dt-d
      text: A solid becomes נ״ט בר נ״ט when it leaves the pot, but a liquid poured directly in a continuous stream
        is treated by the Rama as still connected to the source.
    - id: dt-e
      text: The bowl is permitted because once the liquid leaves the pot the stream is considered disconnected and
        the liquid is נ״ט בר נ״ט.
    - id: dt-f
      text: Lema’ase one may be lenient, but if there is no financial loss one should follow the Rama as an added
        chumra.
    - id: dt-d1
      text: Both the upper pot and the bottom bowl become forbidden because flavor travels equally in both directions
        through the stream.
      distractor: true
    - id: dt-d2
      text: The bowl is permitted only when the upper pot is eino ben-yomo; a ben-yomo stream is universally forbidden.
      distractor: true
- id: stam-benefit
  title: סתם יינם — definitions and benefit today
  prompt: Match the highlighted wine categories and the principal positions about benefiting today from stam yeinam
    and Jewish-owned wine touched by a non-Jew.
  modelAnswer: יין נסך is wine used for libation. סתם יינם is ordinary wine owned by a non-Jew that was not necessarily
    used for libation. Rashi and the Geonim permit benefit today from both stam yeinam and Jewish-owned wine touched
    by a non-Jew. Rosh permits benefit only from Jewish-owned wine touched by a non-Jew, not stam yeinam. Rambam
    forbids benefit from both. S”A follows Rambam. Rama quotes the Geonim and permits benefit from both today, but
    says to rely on this bedieved or for financial loss and that it is best to be stringent about buying and selling
    for profit.
  notes:
    compact: 16
    full: 45
  tags:
  - סתם יינם — Foundations & Benefit
