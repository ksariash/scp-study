        start: 160
        label: Deliberate bitul — Rav Moshe
    responses:
    - id: sc-r1
      text: Requires shishim against the wine absorbed through the barrel’s full thickness; that amount is not present
        in a first-fill sherry cask.
    - id: sc-r2
      text: Use the more lenient wine ratio and the כדי קליפה absorbed without heat, giving substantially more room
        for bitul.
    - id: sc-r3
      text: A deliberately contributed flavor blocks bitul only when the flavor is strong; a weak remaining flavor
        can still be batel.
    - id: sc-r4
      text: The sherry mainly prevents the bad oak flavor from entering the whiskey rather than contributing an
        actual tasted sherry flavor.
    - id: sc-r5
      text: The rule that a coloring ingredient is never batel is limited to biblical prohibitions and does not
        apply the same way to rabbinic stam yeinam.
    - id: sc-r6
      text: Because the product is made primarily for non-Jewish customers, the producer is not viewed as deliberately
        nullifying the prohibition for Jews.
    - id: sc-r7
      text: The rabbinic rule against deliberate bitul applies where the rabbinic prohibition has a Torah basis;
        according to the Rama, stam yeinam today rests on intermarriage rather than a practical libation concern.
    - id: sc-d1
      text: Sherry flavor is automatically permitted whenever the whiskey is older than twenty-four hours because
        all absorbed wine becomes pagum.
      distractor: true
    - id: sc-d2
      text: Color can never create a halachic concern in a rabbinic prohibition, regardless of the authority or
        circumstances.
      distractor: true
- id: wine-touch-criteria
  title: Wine contact — the four criteria for full prohibition
  prompt: What are the four highlighted criteria needed for wine touched by a non-Jew to become fully forbidden
    for both drinking and benefit?
  modelAnswer: 'The four criteria are: intent to touch the wine; knowledge that the liquid is wine; touching for
    the sake of the wine rather than while distracted or occupied with something else; and shaking the wine. The
    order is not significant.'
