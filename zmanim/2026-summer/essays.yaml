- id: sherry-casks
  title: Sherry-cask whisky — four concerns and the highlighted responses
  prompt: Match the highlighted sherry-cask concerns and the positions used in the course to address them.
  modelAnswer: Shach requires enough whiskey to nullify the wine absorbed through the full barrel thickness, which
    a cask does not contain. The S”A/Taz approach uses a 1:6 ratio and only the כדי קליפה absorbed without heat.
    Flavor is a separate concern because an ingredient deliberately used for flavor is normally not batel; Rav Moshe
    says a weak remaining flavor can still be batel, while Mishnah Halachos says the sherry mainly prevents defective
    wood flavor rather than contributing actual sherry taste. Color is a concern because coloring ingredients are
    normally not batel; Minchas Yitzchak limits that rule to biblical prohibitions. Deliberate bitul is addressed
    because production is primarily for non-Jewish customers, and Rav Moshe additionally says that the rabbinic
    rule against deliberate bitul applies when the rabbinic prohibition has a Torah basis; according to the Rama,
    stam yeinam today is an intermarriage decree without a libation-based Torah root.
  notes:
    compact: 25
    full: 63
  tags:
  - Wine Processing & Products
  pairings:
