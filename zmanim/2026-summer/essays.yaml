    downgrade can permit drinking, with Shach emphasizing reliance especially for loss. S”A
    similarly prohibits drinking after accidental touch while permitting benefit; Rama can be more
    lenient for today’s non-Jews, with Shach more cautious without loss. On shaking an open bottle,
    S”A prohibits drinking and benefit while Rama permits on his downgrade. Rav Ovadya still forbids
    drinking after a Muslim’s deliberate pour, and Rav Elyashiv treats a nonreligious Jew’s pour as
