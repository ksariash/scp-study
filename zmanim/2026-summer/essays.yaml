- id: nitzok
  title: נצוק — the stream connection
  prompt: Kosher wine is poured in a continuous stream into prohibited wine or prohibited residue.
    Discuss whether נצוק connects the source to the receiving wine, the significant-loss rule, and
    how mevushal status or ששים may affect the case.
  modelAnswer: Rashi and Rav Chisda treat נצוק as a connection, while Rabbeinu Tam does not. S”A and
    Rama allow reliance on the non-connection view in genuine significant loss. A mevushal source
    can still face the issue when poured into already-forbidden non-mevushal residue; sufficient
    ששים can provide a bitul route, though deliberately creating the ratio raises אין מבטלין איסור
    לכתחילה.
  notes:
    compact: 8
    full: 153
  tags:
    - Wine Contact & Touch
    - נצוק
  facts:
    - id: nz1
      label: Connection view
      authority: Rashi / Rav Chisda
      position: treat the continuous pouring stream as a halachic connection that can transmit the
        prohibition back to the source wine.
      reviewClips:
        - review: 15
          start: 40
          label: נצוק — stream connection
    - id: nz2
      label: Non-connection view
      authority: Rabbeinu Tam
      position: does not treat the continuous pouring stream as connecting the source wine to the
        prohibited wine below.
      reviewClips:
        - review: 15
          start: 40
          label: נצוק — stream connection
    - id: nz3
      label: Significant loss
      authority: S”A / Rama
      position: allow reliance on Rabbeinu Tam’s non-connection view when there is a genuine significant
        loss.
      reviewClips:
        - review: 15
          start: 138
          label: Significant loss and נצוק
    - id: nz4
      label: Mevushal source limitation
      authority: Mevushal source wine
      position: can still be affected by נצוק when it is poured into residue that is already forbidden
        non-mevushal wine.
      reviewClips:
        - review: 15
          start: 212
          label: Mevushal source wine and נצוק
    - id: nz5
      label: Bitul route
      authority: ששים in the source against the residue
      position: can provide a bitul route against forbidden residue, although deliberately creating the
        ratio can raise אין מבטלין איסור לכתחילה.
      reviewClips:
        - review: 15
          start: 160
          label: ששים in the source
- id: unattended-wine
  title: Wine left with a non-Jew
  prompt: Jewish wine is left with a non-Jew. Explain the rules for open wine left with an idolater or
    Muslim, when יוצא ונכנס works, and what kinds of seals or other protections can preserve the
    wine.
  modelAnswer: S”A prohibits open wine immediately when it is left alone with an idolater under the
    access conditions. For a Muslim, the course rule uses enough time to walk a mil, though Shach
    can be stricter where drinking itself is the concern. יוצא ונכנס depends on unpredictability of
    return and lack of visual/locking barriers; a fixed known schedule undermines it. Effective
    seals or other protections must create tamper evidence or credible fear of being caught.
  notes:
    compact: 9
    full: 159
  tags:
    - Unattended Wine
  facts:
    - id: uw1
      label: Open wine with idolater
      authority: S”A
      position: prohibits open Jewish wine immediately when it is left alone with an idolater and the
        relevant access conditions are present.
      reviewClips:
        - review: 15
          start: 310
          label: Open wine left with an idolater
    - id: uw2
      label: Open wine with Muslim
      authority: The course rule for a Muslim
      position: prohibits open Jewish wine left alone with a Muslim after enough time has passed to walk a
        mil.
      reviewClips:
        - review: 15
          start: 348
          label: Wine left with a Muslim
    - id: uw3
      label: Muslim — Shach qualification
      authority: Shach
      position: can be stricter in an unattended-Muslim case when drinking the wine itself is the concern.
      reviewClips:
        - review: 15
          start: 338
          label: Rama / Shach unattended-wine qualification
    - id: uw4
      label: יוצא ונכנס
      authority: יוצא ונכנס
      position: protects the wine when the non-Jew does not know a meaningful absence window, cannot see
        the Jew approaching, and cannot lock the Jew out from returning.
      reviewClips:
        - review: 16
          start: 161
          label: יוצא ונכנס
    - id: uw5
      label: Fixed schedule
      authority: A fixed weekly run / known schedule
      position: undermines יוצא ונכנס because a predictable return schedule removes the deterrent.
      reviewClips:
        - review: 16
          start: 195
          label: יוצא ונכנס requirements
    - id: uw6
      label: Protective options
      authority: Protective options
      position: include double seals, effective locks or combinations, monitored cameras, or hiding the
        wine when those measures create tamper evidence or a credible fear of being caught.
      reviewClips:
        - review: 16
          start: 0
          label: Seals and protective options
