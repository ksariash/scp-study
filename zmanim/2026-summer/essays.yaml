      accepts:
      - sc-r5
      reviewClips:
      - review: 10
        start: 115
        label: Sherry color
    - id: sc-majority-non-jews
      label: Production mainly for non-Jews
      context: אין מבטלין איסור לכתחילה
      accepts:
      - sc-r6
      reviewClips:
      - review: 10
        start: 136
        label: Deliberate bitul concern
    - id: sc-rav-moshe-bitul
      label: Rav Moshe
      context: אין מבטלין איסור לכתחילה
      accepts:
