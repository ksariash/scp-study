      reviewClips:
        - review: 8
          start: 178
          label: Evaporation and pasteurization
- id: sherry-casks
  title: Sherry-cask whisky
  prompt: A whisky is aged in a sherry cask. Discuss the major reasons to prohibit or permit it,
    including the amount needed for bitul, whether the sherry contributes positive flavor, and the
    issue of אין מבטלין איסור לכתחילה.
  modelAnswer: Shach can require ששים against the absorbed wine/barrel thickness; S”A and Taz use a
    1:6 measure against כדי קליפה. Rav Moshe describes the remnant as weakened קיוהא, while Mishna
    Halachot says the sherry prevents bad oak flavor rather than adding tasted wine flavor. For אין
    מבטלין איסור לכתחילה, the notes/key give a manufacture-for-non-Jews route and Rav Moshe’s
    limitation for a rabbinic prohibition without a practical biblical libation root. Second-fill
    casks have more room because the retained taste is older/weaker.
  notes:
    compact: 6
    full: 88
  tags:
    - סתם יינם
    - Bitul
  facts:
    - id: sc1
      label: Quantity — Shach
      authority: Shach
      position: can require ששים against the absorbed wine represented by the barrel thickness.
      reviewClips:
        - review: 10
          start: 11
          label: Sherry-cask quantities
    - id: sc2
      label: Quantity — S”A/Taz
      authority: S”A / Taz
      position: use a 1:6 measure against כדי קליפה when evaluating absorbed sherry in the cask.
      reviewClips:
        - review: 10
          start: 11
          label: Sherry-cask quantities
    - id: sc3
      label: Flavor — Rav Moshe
      authority: Rav Moshe
      position: characterizes the remaining sherry taste as weakened קיוהא rather than meaningful positive
        wine flavor.
      reviewClips:
        - review: 10
          start: 65
          label: Sherry flavor — Rav Moshe
    - id: sc4
      label: Flavor — Mishna Halachot
      authority: Mishna Halachot
      position: frames the sherry as preventing bad oak flavor rather than contributing a tasted positive
        wine flavor.
      reviewClips:
        - review: 10
          start: 93
          label: Sherry flavor — Mishnah Halachos
    - id: sc5
      label: Deliberate bitul — non-Jewish manufacture
      authority: One route in the notes/key
      position: uses manufacture for non-Jews as one route for addressing אין מבטלין איסור לכתחילה in the
        sherry-cask discussion.
      reviewClips:
        - review: 10
          start: 136
          label: Deliberate bitul concern
