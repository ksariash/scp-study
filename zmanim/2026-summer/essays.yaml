- id: social-drinking-business
  title: Social drinking — beer, business drinks, and coffee
  prompt: "A Jew is invited to have drinks with non-Jews in several settings: ordinary beer, a
    business drink at a non-Jewish bar, and coffee at a coffee shop. Discuss the relevant opinions
    and distinctions."
  modelAnswer: Rama limits the beer decree so ordinary grain beer is outside it; Gra rejects that
    narrowing. Kaf HaChaim and Pri Chadash stress sporadic place and infrequency in the non-fixed
    case. For a business drink, S”A/Gra prohibit as the baseline, Rav Moshe allows room where
    refusal creates איבה, and Ohr L’Tzion remains cautious. Gra and Panim Meirot are among the
    stricter views on prestigious coffee-shop social drinking.
  notes:
    compact: 7
    full: 102
  tags:
    - סתם יינם
    - Social Drinking
  facts:
    - id: sdb1
      label: Ordinary beer — Rama
      authority: Rama
      position: limits the beer decree so ordinary grain beer is not included.
      reviewClips:
        - review: 11
          start: 103
          label: Rama on ordinary beer
    - id: sdb2
      label: Ordinary beer — Gra
      authority: Gra
      position: rejects the view that ordinary grain beer is outside the social-drinking decree.
      reviewClips:
        - review: 11
          start: 2
          label: S”A as understood by the Gra
    - id: sdb3
      label: Non-fixed drinking factors
      authority: Kaf HaChaim / Pri Chadash
      position: require attention to both an infrequent drinking occasion and a non-fixed or sporadic
        place when using the non-fixed-drinking leniency.
      reviewClips:
        - review: 11
