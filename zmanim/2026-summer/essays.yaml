- id: nbn-intentional-cooking
  title: נ״ט בר נ״ט — deliberate cooking
  prompt: A parve food is deliberately cooked in a clean meat or dairy vessel with the intention of
    later adding the opposite type. Discuss the relevant opinions for a ben-yomo vessel and an
    eino-ben-yomo vessel, and include the dry-food-on-the-opposite-plate application.
  modelAnswer: For a ben-yomo vessel, Shach, Ben Ish Chai, and Kaf HaChaim forbid לכתחילה deliberately
    cooking the parve food when the plan is to add the opposite type, while Rav Ovadya permits
    לכתחילה. For an eino-ben-yomo vessel, Gra and Badei HaShulchan permit; Chochmat Adam and Rav
    Elyashiv initially forbid but allow when no other pot is available. Rav Moshe permits לכתחילה
    placing dry parve food cooked in a ben-yomo meat or dairy vessel onto a clean plate of the
    opposite type, while Pri Megadim dissents.
  notes:
    compact: 1
    full: 5
  tags:
    - נ״ט בר נ״ט
  facts:
    - id: nbn1
      label: Ben-yomo — stricter S”A-track authorities
      authority: Shach / Ben Ish Chai / Kaf HaChaim
      position: forbid לכתחילה deliberately cooking parve food in a ben-yomo meat or dairy vessel when the
        plan is to add the opposite type.
      reviewClips:
        - review: 1
          start: 96
          label: Deliberately creating נ״ט בר נ״ט
    - id: nbn2
      label: Ben-yomo — Rav Ovadya
      authority: Rav Ovadya
      position: permits לכתחילה deliberately cooking parve food in a ben-yomo meat or dairy vessel when
        the plan is to add the opposite type.
      reviewClips:
        - review: 1
          start: 96
          label: Deliberately creating נ״ט בר נ״ט
    - id: nbn3
      label: Eino-ben-yomo — permissive Ashkenazic authorities
      authority: Gra / Badei HaShulchan
      position: permit לכתחילה deliberately cooking parve food in an eino-ben-yomo meat or dairy vessel
        for later use with the opposite type.
      reviewClips:
        - review: 1
          start: 184
          label: Eino-ben-yomo dispute
    - id: nbn4
      label: Eino-ben-yomo — stricter Ashkenazic authorities
      authority: Chochmat Adam / Rav Elyashiv
      position: forbid לכתחילה deliberately cooking parve food in an eino-ben-yomo meat or dairy vessel
        for later use with the opposite type, but allow the cooking when no other pot is available.
      reviewClips:
        - review: 1
          start: 184
          label: Eino-ben-yomo dispute
    - id: nbn5
      label: Dry solid on opposite plate
      authority: Rav Moshe
      position: permits לכתחילה placing dry parve food cooked in a ben-yomo meat or dairy vessel onto a
        clean plate of the opposite type.
      reviewClips:
        - review: 2
          start: 0
          label: Dry food on the opposite-type plate
    - id: nbn6
      label: Dry solid dissent
      authority: Pri Megadim
      position: forbids לכתחילה placing dry parve food cooked in a ben-yomo meat or dairy vessel onto a
        clean plate of the opposite type.
      reviewClips:
        - review: 2
          start: 0
          label: Dry food on the opposite-type plate
- id: nbn-model-failures
  title: נ״ט בר נ״ט — when the model may fail
  prompt: When does a transfer qualify as נ״ט בר נ״ט? Discuss the dispute over food-to-food transfer
    and the case where the original source and recipient are still cooking together.
  modelAnswer: Pri Megadim and Aruch HaShulchan do not count the first food-to-food transfer as נ״ט בר
    נ״ט; Pnei Aryeh and Rav Ovadya do, while Chavot Da’at and Yad Yehuda are intermediate. For an
    ongoing cooking connection, Chavot Da’at says the weakening has not yet occurred, Beit Ephraim
    says it can, Ashkenazic practice can rely on Beit Ephraim בדיעבד or for significant loss, and
    Rav Ovadya follows the lenient view.
  notes:
    compact: 2
    full: 12
  tags:
    - נ״ט בר נ״ט
  facts:
    - id: nbf1
      label: Food → food → vessel — strict
      authority: Pri Megadim / Aruch HaShulchan
      position: do not treat the first food-to-food transfer as a valid נ״ט בר נ״ט transfer.
      reviewClips:
        - review: 2
          start: 131
          label: Food → food → vessel
    - id: nbf2
      label: Food → food → vessel — lenient
      authority: Pnei Aryeh / Rav Ovadya
      position: do treat the first food-to-food transfer as a valid weakened transfer for נ״ט בר נ״ט.
      reviewClips:
        - review: 2
          start: 131
          label: Food → food → vessel
    - id: nbf3
      label: Food → food → vessel — intermediate
      authority: Chavot Da’at / Yad Yehuda
      position: take intermediate positions on whether a food-to-food transfer counts as נ״ט בר נ״ט.
      reviewClips:
        - review: 2
          start: 131
          label: Food → food → vessel
    - id: nbf4
      label: Ongoing connection — strict
      authority: Chavot Da’at
      position: holds that נ״ט בר נ״ט has not yet occurred while the original source and recipient are
        still cooking together.
      reviewClips:
        - review: 2
          start: 153
          label: Ongoing cooking connection
    - id: nbf5
      label: Ongoing connection — lenient
      authority: Beit Ephraim
      position: holds that נ״ט בר נ״ט can apply even while the original source and recipient remain
        connected through cooking.
      reviewClips:
        - review: 2
          start: 153
          label: Ongoing cooking connection
    - id: nbf6
      label: Practical reliance
      authority: Ashkenazic practice
      position: is initially cautious when the source and recipient are still cooking together, but can
        rely on Beit Ephraim בדיעבד or for significant loss.
      reviewClips:
        - review: 2
          start: 153
          label: Ongoing cooking connection
    - id: nbf7
      label: Rav Ovadya on ongoing connection
      authority: Rav Ovadya
      position: follows the lenient position that נ״ט בר נ״ט can apply even while the original source and
        recipient remain connected through cooking.
      reviewClips:
        - review: 2
          start: 153
          label: Ongoing cooking connection
- id: fish-meat-bitul
  title: Fish and meat — bitul and סכנה
  prompt: Fish accidentally became mixed with meat. Discuss whether bitul applies to a סכנה mixture
    and what additional grounds for leniency the course gives when there is no ששים.
  modelAnswer: Maharil says bitul does not apply to סכנה, while Issur VeHeiter permits and the course
    follows the lenient practical custom. Without ששים after an accidental mixture, S”A’s rule
    allowing added היתר to an accidental rabbinic mixture, Pitchei Teshuvah’s question whether אין
    מבטלין governs סכנה, Magen Avraham’s question whether the danger applies today, and Divrei
    Malkiel’s extension to actual mixture are distinct possible tzirufim.
  notes:
    compact: 3
    full: 23
  tags:
    - Fish & Meat
    - סכנה
  facts:
    - id: fmb1
      label: Bitul — Maharil
      authority: Maharil
      position: holds that ordinary bitul does not apply to a fish-and-meat סכנה mixture.
      reviewClips:
        - review: 3
          start: 74
          label: Bitul in a fish-and-meat סכנה mixture
    - id: fmb2
      label: Bitul — Issur VeHeiter
      authority: Issur VeHeiter
      position: permits bitul for a fish-and-meat סכנה mixture; the practical course custom follows this
        lenient approach.
      reviewClips:
        - review: 3
          start: 74
          label: Bitul in a fish-and-meat סכנה mixture
    - id: fmb3
      label: Accidental rabbinic mixture — S”A
      authority: S”A
      position: permits adding היתר to an accidentally created rabbinic mixture.
      reviewClips:
        - review: 3
          start: 74
          label: Bitul and additional leniency routes
    - id: fmb4
      label: אין מבטלין route
      authority: Pitchei Teshuvah
      position: argues that אין מבטלין איסור לכתחילה may not govern a סכנה mixture in the ordinary way.
      reviewClips:
        - review: 3
          start: 74
          label: Bitul and additional leniency routes
    - id: fmb5
      label: Changed danger route
      authority: Magen Avraham
      position: questions whether the fish-and-meat danger applies today, creating an additional possible
        tziruf.
      reviewClips:
        - review: 3
          start: 27
          label: Magen Avraham as a leniency factor
    - id: fmb6
      label: Extension to actual mixture
      authority: Divrei Malkiel
      position: extends the changed-danger consideration even to a case in which fish and meat actually
        became mixed.
      reviewClips:
        - review: 3
          start: 27
          label: Changed-danger leniency factor
- id: dish-transfer
  title: Dish transfer — simultaneous vessels, עירוי, and a continuous stream
  prompt: "Discuss the main disputes governing meat/dairy taste transfer in hot water: simultaneous
    clean ben-yomo vessels, עירוי onto dirty opposite dishes, and a continuous stream of hot parve
    soup into a cold opposite-type bowl."
  modelAnswer: S”A permits simultaneous clean ben-yomo meat and dairy vessels in hot parve water,
    while Rama forbids. For עירוי onto dirty opposite dishes, Rama permits and Shach forbids because
    עירוי can transfer כדי קליפה. For a continuous hot parve stream from a ben-yomo meat pot into a
    cold dairy bowl, Rama forbids the bowl while Shach permits it as נ״ט בר נ״ט. Ohr L’Tzion
    supplies an additional sink leniency by treating travel through pipes as weakening to כלי שני.
  notes:
    compact: 3
    full: 29
  tags:
    - Dish Transfer
    - עירוי
  facts:
    - id: dt1
      label: Simultaneous clean ben-yomo vessels — S”A
      authority: S”A
      position: permits clean ben-yomo meat and dairy vessels to be together in hot parve water.
      reviewClips:
        - review: 4
          start: 58
          label: Clean ben-yomo meat and dairy vessels
    - id: dt2
      label: Simultaneous clean ben-yomo vessels — Rama
      authority: Rama
      position: forbids clean ben-yomo meat and dairy vessels from being together in hot parve water
        because the connected tastes meet too directly.
      reviewClips:
        - review: 4
          start: 58
          label: Clean ben-yomo meat and dairy vessels
    - id: dt3
      label: עירוי — Rama
      authority: Rama
      position: permits עירוי כלי ראשון onto dirty meat and dairy dishes.
      reviewClips:
        - review: 4
          start: 237
          label: עירוי כלי ראשון
    - id: dt4
      label: עירוי — Shach
      authority: Shach
      position: forbids עירוי כלי ראשון onto dirty meat and dairy dishes because עירוי can transfer taste
        כדי קליפה.
      reviewClips:
        - review: 4
          start: 237
          label: עירוי כלי ראשון
    - id: dt5
      label: Continuous stream — Rama
      authority: Rama
      position: forbids a cold opposite-type bowl when hot parve soup pours into it continuously from a
        ben-yomo meat or dairy pot.
      reviewClips:
        - review: 4
          start: 128
          label: Continuous stream into opposite-type vessel
    - id: dt6
      label: Continuous stream — Shach
      authority: Shach
      position: permits the cold opposite-type bowl because the continuous stream is already treated as
        נ״ט בר נ״ט.
      reviewClips:
        - review: 4
          start: 128
          label: Continuous stream into opposite-type vessel
    - id: dt7
      label: Piped hot water
      authority: Ohr L’Tzion
      position: treats hot water that traveled through pipes as weakened to the level of כלי שני for the
        sink application taught in the course.
      reviewClips:
        - review: 4
          start: 292
          label: Hot faucet water and pipes
- id: soap-dishwasher
  title: Soap and dishwashers
