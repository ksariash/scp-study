- id: stam-benefit
  title: סתם יינם — why benefit was prohibited and the modern-non-Jew dispute
  prompt: Why is benefit from סתם יינם prohibited, and how do the major opinions treat benefit today
    when ordinary non-Jews are not assumed to make wine libations? Include the practical S”A/Rama
    framework.
  modelAnswer: Beit Yosef explains the benefit ban by modeling סתם יינם on יין נסך; Ran connects it to
    preventing benefit from actual יין נסך; Rashba describes a later benefit decree after the
    original drinking decree. Rashi and the Geonim permit benefit today while drinking remains
    prohibited; Rosh distinguishes the non-Jew’s own wine from Jewish wine touched by a non-Jew;
    Rambam keeps benefit prohibited in both. S”A follows Rambam, while Rama allows Geonic/Rashi
    reliance בדיעבד or for loss.
  notes:
    compact: 5
    full: 61
  tags:
    - סתם יינם
    - Benefit
  facts:
    - id: syb1
      label: Benefit rationale — Beit Yosef
      authority: Beit Yosef
      position: explains that Chazal modeled the prohibition of סתם יינם on the rules of יין נסך.
      reviewClips:
        - review: 6
          start: 199
          label: Why benefit from סתם יינם was prohibited
    - id: syb2
      label: Benefit rationale — Ran
      authority: Ran
      position: explains that the benefit prohibition on סתם יינם helps prevent people from benefiting
        from actual יין נסך.
      reviewClips:
        - review: 6
          start: 199
          label: Why benefit from סתם יינם was prohibited
    - id: syb3
      label: Benefit rationale — Rashba
      authority: Rashba
      position: explains that drinking was prohibited first and benefit was prohibited later when people
        became lax around libation wine.
      reviewClips:
        - review: 6
          start: 199
          label: Why benefit from סתם יינם was prohibited
    - id: syb4
      label: Modern non-Jews — Rashi/Geonim
      authority: Rashi / Geonim
      position: permit benefit today from both a non-Jew’s own wine and Jewish wine touched by a non-Jew,
        while drinking remains prohibited.
      reviewClips:
        - review: 7
          start: 1
          label: Benefit from סתם יינם today
    - id: syb5
      label: Modern non-Jews — Rosh
      authority: Rosh
      position: keeps benefit from a non-Jew’s own wine prohibited but permits benefit from Jewish wine
        touched by the non-Jew.
      reviewClips:
        - review: 7
          start: 1
          label: Benefit from סתם יינם today
    - id: syb6
      label: Modern non-Jews — Rambam
      authority: Rambam
      position: keeps benefit prohibited both from a non-Jew’s own wine and from Jewish wine touched by
        the non-Jew.
      reviewClips:
        - review: 7
          start: 1
          label: Benefit from סתם יינם today
    - id: syb7
      label: Practical psak — S”A
      authority: S”A
      position: follows Rambam as the formal baseline and keeps benefit prohibited in both modern-non-Jew
        categories.
      reviewClips:
        - review: 7
          start: 65
          label: S”A / Rama practical framework
    - id: syb8
      label: Practical psak — Rama
      authority: Rama
      position: allows reliance בדיעבד or for loss on the Rashi/Geonim leniency permitting benefit today,
        but not as a routine profit model.
      reviewClips:
        - review: 7
          start: 65
          label: S”A / Rama practical framework
- id: mevushal-pasteurization
  title: מבושל — ownership and pasteurization
  prompt: A non-Jew owns kosher mevushal wine, and another case involves modern pasteurization of
    kosher wine. Discuss the major opinions on whether מבושל protects the wine in each situation.
  modelAnswer: Rosh, Ritva, and Ramban permit non-Jewish ownership of kosher mevushal wine on the “not
    ordinary wine” logic; R. Akiva Eiger’s analysis keeps the ownership decree, while the notes read
    S”A/Taz practically toward permission. On pasteurization, Shach, Ran, and Rashba emphasize
    heating with some evaporation; Rav Moshe and Rav Ovadya accept יד סולדת בו; R. Shlomo Zalman and
    others require a more meaningful cooking/evaporation change.
  notes:
    compact: 6
    full: 76
  tags:
    - סתם יינם
    - מבושל
  facts:
    - id: mp1
      label: Non-Jew owns mevushal — permissive line
      authority: Rosh / Ritva / Ramban
      position: permit non-Jewish ownership of kosher mevushal wine because cooked wine is treated as
        outside the ordinary wine category for this rule.
      reviewClips:
        - review: 8
          start: 128
          label: Non-Jewish ownership of mevushal wine
    - id: mp2
      label: Non-Jew owns mevushal — stringent analysis
      authority: R. Akiva Eiger
      position: retains the non-Jew-owned wine decree even when the kosher wine is mevushal.
      reviewClips:
        - review: 8
          start: 128
          label: Non-Jewish ownership of mevushal wine
    - id: mp3
      label: Practical reading
      authority: S”A / Taz
      position: are read in the course notes as supporting practical permission for non-Jewish ownership
        of kosher mevushal wine.
      reviewClips:
        - review: 8
          start: 128
          label: Non-Jewish ownership of mevushal wine
    - id: mp4
      label: Pasteurization — evaporation focus
      authority: Shach / Ran / Rashba
      position: focus on heating with some evaporation as the classical marker that wine has become מבושל.
      reviewClips:
        - review: 8
          start: 170
          label: How hot wine must become
    - id: mp5
      label: Pasteurization — yad soledet
      authority: Rav Moshe / Rav Ovadya
      position: accept יד סולדת בו as sufficient for the modern pasteurization threshold taught in the
        course.
      reviewClips:
        - review: 8
          start: 170
          label: Yad soledet and pasteurization
    - id: mp6
      label: Pasteurization — stronger change
      authority: R. Shlomo Zalman and others
      position: require a more meaningful cooking or evaporation change before modern pasteurization
