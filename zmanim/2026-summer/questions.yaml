- id: 1
  category: נ״ט בר נ״ט
  type: single
  prompt: Which statement best captures the course rule of נ״ט בר נ״ט?
  choices:
    - Meat/dairy taste can become weakened through successive transfers; that leniency is specific
      to בשר בחלב and does not neutralize an inherently forbidden taste.
    - Any taste becomes permitted after two transfers, whether it began as meat, dairy, or an
      inherently forbidden substance.
    - נ״ט בר נ״ט applies only when both original foods are parve.
    - The halacha rejects Shmuel and treats every transferred meat/dairy taste as fully strong.
  answer:
    - A
  explanation: Successive meat/dairy transfers can weaken taste for בשר בחלב, but the mechanism does
    not neutralize inherently forbidden taste.
  notes:
    compact: 1
    full: 1
  reviewClips:
